name: Temporary Module Boundary Audit

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
      - name: Audit module persistence and file ownership
        run: |
          echo '=== NONCANONICAL MODULE GO FILES ==='
          find server/internal/modules -type f -name '*.go' ! -name '*_test.go' | \
            grep -Ev '/(model|repository|service|validation|handler|routes|consumer|jobs)\.go$' || true
          echo '=== REPOSITORIES HOLDING POOLS OR DB HANDLES ==='
          grep -R -nE '(^|[[:space:]])(db|pool)[[:space:]]+\*pgxpool\.Pool' server/internal/modules --include='repository.go' || true
          echo '=== TRANSACTION STARTS IN MODULE REPOSITORIES ==='
          grep -R -nE '\.(Begin|BeginTx)\(' server/internal/modules --include='repository.go' || true
          echo '=== RAW SQL EXECUTION IN MODULES ==='
          grep -R -nE '\.(Exec|Query|QueryRow)\(ctx,[[:space:]]*`' server/internal/modules --include='*.go' || true
          echo '=== CAPABILITY-SPECIFIC DELIVERY PACKAGES ==='
          find server/internal/delivery -mindepth 1 -maxdepth 3 -type f -name '*.go' | sort
