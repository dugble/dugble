name: Temporary Refactor Webhook Boundaries

on:
  push:
    branches:
      - agent/refactor-webhook-module-boundaries

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-webhook-module-boundaries
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Apply refactor
        run: python3 .github/scripts/temp_refactor_webhook_boundaries.py
      - name: Format
        run: gofmt -w server/internal/modules/webhooks server/internal/registry/server/modules.go
      - name: Assert repository boundary
        run: |
          if grep -Eq '^[[:space:]]*db[[:space:]]+\*pgxpool\.Pool' server/internal/modules/webhooks/repository.go; then
            echo 'webhook repository still stores pgxpool.Pool' >&2
            exit 1
          fi
          if grep -q 'InTransaction' server/internal/modules/webhooks/repository.go; then
            echo 'webhook repository still owns transaction orchestration' >&2
            exit 1
          fi
          if grep -q 'BeginTx' server/internal/modules/webhooks/repository.go; then
            echo 'webhook repository still starts transactions' >&2
            exit 1
          fi
          grep -q 'func (r \*Repository) WithTx(tx pgx.Tx)' server/internal/modules/webhooks/repository.go
          grep -q 'BeginTx' server/internal/modules/webhooks/service.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move webhook transactions into service"
          git push origin HEAD:agent/refactor-webhook-module-boundaries
