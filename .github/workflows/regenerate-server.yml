name: Regenerate Server Artifacts

on:
  push:
    branches-ignore:
      - main
    paths:
      - ".github/workflows/regenerate-server.yml"
      - ".golangci.yml"
      - "server/go.mod"
      - "server/go.sum"
      - "server/sqlc.yaml"
      - "server/atlas.hcl"
      - "server/migrations/**"
      - "server/internal/database/queries/**"
      - "server/**/*.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: v0.37.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Regenerate sqlc
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Regenerate Atlas checksum
        run: atlas migrate hash --dir "file://migrations"

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config ../.golangci.yml

      - name: Format server Go
        run: golangci-lint fmt --config ../.golangci.yml ./...

      - name: Verify generated diff
        working-directory: .
        run: git diff --check

      - name: Commit regenerated artifacts
        working-directory: .
        run: |
          if [[ -z "$(git status --porcelain -- server)" ]]; then
            echo "No generated or formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server
          git commit -m "chore: regenerate server artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
