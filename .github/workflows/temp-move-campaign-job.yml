name: Temporary Move Campaign Job

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Wire module-owned SMS campaign job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/registry/worker/modules.go')
          s = p.read_text()
          s = s.replace(
              'smsCampaignConsumer := smscampaignexecution.NewConsumer(\n\t\tsmscampaignexecution.NewProcessor(smscampaignmodule.NewRepository(db), smsCampaignSMSService),\n\t\tsmscampaignexecution.Config{PollInterval: time.Second, BatchSize: 100},\n\t)',
              'smsCampaignJob := smscampaignmodule.NewJob(\n\t\tsmscampaignexecution.NewProcessor(smscampaignmodule.NewRepository(db), smsCampaignSMSService),\n\t\tsmscampaignmodule.JobConfig{PollInterval: time.Second, BatchSize: 100},\n\t)',
          )
          s = s.replace('smsCampaign:               smsCampaignConsumer.Run,', 'smsCampaign:               smsCampaignJob.Run,')
          p.write_text(s)
          PY
          rm server/internal/delivery/sms/campaign/consumer.go
          gofmt -w server/internal/modules/campaign/jobs.go server/internal/registry/worker/modules.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move SMS campaign polling into module jobs"
          git push origin HEAD:agent/fix-domain-lifecycle-claims
