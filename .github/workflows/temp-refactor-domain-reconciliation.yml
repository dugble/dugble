name: Temporary Refactor Domain Reconciliation

on:
  push:
    branches:
      - agent/refactor-domain-reconciliation-job

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-domain-reconciliation-job
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Move worker wiring to domain module
        run: |
          sed -i '/domainreconciliation "github.com\/dugble\/dugble\/server\/internal\/delivery\/domain"/d' server/internal/registry/worker/modules.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/registry/worker/modules.go')
          s = p.read_text()
          old = '''\tdomainConsumer := domainreconciliation.NewConsumer(\n\t\tdomainRepository,\n\t\tdomainService,\n\t\tdomainreconciliation.Config{\n\t\t\tPollInterval:           30 * time.Second,\n\t\t\tBatchSize:              25,\n\t\t\tConcurrency:            5,\n\t\t\tLockTimeout:            2 * time.Minute,\n\t\t\tCheckTimeout:           20 * time.Second,\n\t\t\tHealthCheckInterval:    24 * time.Hour,\n\t\t\tHealthRetryInterval:    time.Hour,\n\t\t\tHealthFailureThreshold: 3,\n\t\t},\n\t\t"sender-domain-reconciliation-"+uuid.NewString(),\n\t)\n\tdomainConsumer.WithNotifier(notificationEmailService)'''
          new = '''\tdomainJob, err := domainmodule.NewJob(\n\t\tdomainRepository,\n\t\tdomainService,\n\t\tdomainmodule.DefaultJobConfig(),\n\t\t"sender-domain-reconciliation-"+uuid.NewString(),\n\t)\n\tif err != nil {\n\t\treturn modules{}, fmt.Errorf("initialize sender domain reconciliation: %w", err)\n\t}\n\tdomainJob.WithNotifier(notificationEmailService)'''
          if old not in s:
              raise SystemExit('domain reconciliation wiring block not found')
          s = s.replace(old, new)
          s = s.replace('domainReconciliation:      domainConsumer.Run,', 'domainReconciliation:      domainJob.Run,')
          p.write_text(s)
          PY
      - name: Remove old delivery package
        run: rm -rf server/internal/delivery/domain
      - name: Format
        run: gofmt -w server/internal/modules/domain server/internal/registry/worker/modules.go
      - name: Assert vertical ownership
        run: |
          test ! -d server/internal/delivery/domain
          test -f server/internal/modules/domain/jobs.go
          test -f server/internal/modules/domain/reconciliation.go
          if grep -R 'internal/delivery/domain' -n server --include='*.go'; then
            echo 'delivery/domain import remains' >&2
            exit 1
          fi
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verticalize domain reconciliation job"
          git push origin HEAD:agent/refactor-domain-reconciliation-job
