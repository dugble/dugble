name: Validate Outbox Quarantine

on:
  push:
    branches:
      - feat/outbox-quarantine
    paths:
      - ".github/workflows/outbox-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Format repository code
        working-directory: server
        run: gofmt -w internal/platform/outbox/repository.go

      - name: Refresh Atlas checksums
        run: docker run --rm -v "$PWD/server/migrations:/migrations" arigaio/atlas:1.3.0 migrate hash --dir file:///migrations

      - name: Verify migration layout
        run: |
          test ! -e server/migrations/039_add_outbox_quarantine.sql
          grep -q 'CREATE TABLE IF NOT EXISTS outbox_event_actions' server/migrations/012_create_outbox.sql
          grep -q 'redrive_count INTEGER NOT NULL DEFAULT 0' server/migrations/012_create_outbox.sql

      - name: Test outbox packages
        working-directory: server
        run: go test -race ./internal/platform/outbox ./internal/adapters/nats

      - name: Vet outbox packages
        working-directory: server
        run: go vet ./internal/platform/outbox ./internal/adapters/nats

      - name: Verify diff
        run: git diff --check

      - name: Commit generated checksum and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/internal/platform/outbox/repository.go server/migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(outbox): refresh migration checksum"
          git push origin "HEAD:${GITHUB_REF_NAME}"
