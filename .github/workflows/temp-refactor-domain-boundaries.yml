name: Temporary Refactor Domain Boundaries

on:
  push:
    branches:
      - agent/refactor-domain-module-boundaries

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-domain-module-boundaries
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Apply refactor
        run: python3 .github/scripts/temp_refactor_domain_boundaries.py
      - name: Format
        run: gofmt -w server/internal/modules/domain server/internal/registry/server/modules.go server/internal/registry/worker/modules.go
      - name: Assert repository boundary
        run: |
          if grep -Eq '^[[:space:]]*db[[:space:]]+\*pgxpool\.Pool' server/internal/modules/domain/repository.go; then
            echo 'domain repository still stores pgxpool.Pool' >&2
            exit 1
          fi
          if grep -q 'BeginTx' server/internal/modules/domain/repository.go; then
            echo 'domain repository still starts transactions' >&2
            exit 1
          fi
          grep -q 'func (r \*Repository) WithTx(tx pgx.Tx)' server/internal/modules/domain/repository.go
          grep -q 'BeginTx' server/internal/modules/domain/service.go
          grep -q 'BeginTx' server/internal/modules/domain/reconciliation.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move domain transactions into services"
          git push origin HEAD:agent/refactor-domain-module-boundaries
