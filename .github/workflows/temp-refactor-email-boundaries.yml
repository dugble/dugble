name: Temporary Refactor Email Boundaries

on:
  push:
    branches:
      - agent/refactor-email-module-boundaries

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-email-module-boundaries
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Regenerate sqlc
        working-directory: server
        run: sqlc generate
      - name: Move email transaction boundary into service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('server/internal/modules/email/service.go')
          s = service.read_text()
          s = s.replace('"github.com/jackc/pgx/v5"\n', '"github.com/jackc/pgx/v5"\n\t"github.com/jackc/pgx/v5/pgxpool"\n')
          s = s.replace('type Service struct {\n\trepository', 'type Service struct {\n\tdb                *pgxpool.Pool\n\trepository')
          end = '\treturn service\n}\n\nfunc requireTenant'
          replacement = '\treturn service\n}\n\nfunc (s *Service) WithDatabase(db *pgxpool.Pool) *Service {\n\tif s != nil {\n\t\ts.db = db\n\t}\n\treturn s\n}\n\nfunc requireTenant'
          if end not in s:
              raise SystemExit('email NewService end not found')
          s = s.replace(end, replacement, 1)
          s = s.replace('s.repository.BeginTx(ctx)', 's.db.BeginTx(ctx, pgx.TxOptions{})')
          service.write_text(s)

          registry = Path('server/internal/registry/server/modules.go')
          r = registry.read_text()
          old = 'emailAPIService := emailmodule.NewService(\n\t\temailmodule.NewRepository(db),\n\t\temaildelivery.NewQueue(registry.outbox),\n\t\temailmodule.ServiceConfig{DefaultFromEmail: cfg.AWS.FromEmail, DefaultProvider: domainmodule.DefaultProvider, DefaultRegion: cfg.AWS.Region},\n\t\tbillingService,\n\t)'
          if old not in r:
              raise SystemExit('email service registry wiring not found')
          registry.write_text(r.replace(old, old + '.WithDatabase(db)', 1))
          PY
          gofmt -w server/internal/modules/email/repository.go server/internal/modules/email/service.go server/internal/registry/server/modules.go server/internal/database/sqlc
      - name: Assert repository boundary
        run: |
          if grep -q 'db \+\*pgxpool.Pool' server/internal/modules/email/repository.go; then
            echo 'email repository still owns pgxpool' >&2
            exit 1
          fi
          if grep -Eq '\.Query(Row)?\(|\.Exec\(' server/internal/modules/email/repository.go; then
            echo 'email repository still contains raw database calls' >&2
            exit 1
          fi
          grep -q 'queries \*dbsqlc.Queries' server/internal/modules/email/repository.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor email module persistence boundaries"
          git push origin HEAD:agent/refactor-email-module-boundaries
