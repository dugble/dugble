name: Temporary Domain Query Ownership Cleanup

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Move claim query ownership out of domains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/database/queries/domains.sql')
          s = p.read_text()

          start = s.index('-- name: CreateClaimedDomain :one')
          end = s.index('-- name: ListDomains :many')
          s = s[:start] + s[end:]

          start = s.index('-- name: GetDomainByNameForClaim :one')
          end = s.index('-- name: UpdateDomainConfiguration :one')
          s = s[:start] + s[end:]

          start = s.index('-- name: DeleteDomainForClaim :one')
          end = s.index('-- name: ResolveEmailSenderDomain :one')
          s = s[:start] + s[end:]

          s = s.replace(
              'WHERE domain_record.team_id = sqlc.arg(team_id)\nORDER BY domain_record.created_at DESC, domain_record.id DESC;',
              'WHERE domain_record.team_id = sqlc.arg(team_id)\n  AND domain_record.disabled_at IS NULL\nORDER BY domain_record.created_at DESC, domain_record.id DESC;',
          )
          s = s.replace(
              'WHERE domain_record.normalized_name = lower(trim(sqlc.arg(name)))\n  AND domain_record.team_id = sqlc.arg(team_id);',
              'WHERE domain_record.normalized_name = lower(trim(sqlc.arg(name)))\n  AND domain_record.team_id = sqlc.arg(team_id)\n  AND domain_record.disabled_at IS NULL;',
          )
          s = s.replace(
              'WHERE team_id = sqlc.arg(team_id)\n  AND normalized_name = lower(trim(sqlc.arg(domain_name)))\nLIMIT 1;',
              'WHERE team_id = sqlc.arg(team_id)\n  AND normalized_name = lower(trim(sqlc.arg(domain_name)))\n  AND disabled_at IS NULL\nLIMIT 1;',
          )
          p.write_text(s)
          PY
      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: Compile affected packages
        working-directory: server
        run: go test ./internal/modules/domain ./internal/modules/domainclaim ./internal/modules/email ./internal/registry/server ./internal/registry/worker
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align domain query ownership with vertical modules"
          git push origin HEAD:agent/fix-domain-lifecycle-claims
