name: Temporary Move Broadcast Job

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Wire module-owned broadcast job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/registry/worker/modules.go')
          s = p.read_text()
          s = s.replace(
              'broadcastExecutionConsumer := broadcastexecution.NewConsumer(\n\t\tbroadcastexecution.NewProcessor(broadcastExecutionRepository),\n\t\tbroadcastexecution.Config{PollInterval: time.Second, BatchSize: 100},\n\t)',
              'broadcastExecutionJob := broadcastmodule.NewJob(\n\t\tbroadcastexecution.NewProcessor(broadcastExecutionRepository),\n\t\tbroadcastmodule.JobConfig{PollInterval: time.Second, BatchSize: 100},\n\t)',
          )
          s = s.replace('broadcastExecution:        broadcastExecutionConsumer.Run,', 'broadcastExecution:        broadcastExecutionJob.Run,')
          p.write_text(s)
          PY
          rm server/internal/delivery/broadcast/consumer.go
          rm server/internal/delivery/broadcast/consumer_test.go
          gofmt -w server/internal/modules/broadcast/jobs.go server/internal/modules/broadcast/jobs_test.go server/internal/registry/worker/modules.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move broadcast polling into module jobs"
          git push origin HEAD:agent/fix-domain-lifecycle-claims
