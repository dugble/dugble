name: Temporary Vertical Domain Claim Refactor

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Apply vertical module wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('server/internal/registry/worker/modules.go')
          s = worker.read_text()
          s = s.replace('\tdomainclaimreconciliation "github.com/dugble/dugble/server/internal/delivery/domainclaim"\n', '')
          s = s.replace(
              'domainClaimService := domainclaimmodule.NewService(domainClaimRepository, emailSender, dnsVerifier, emailTenantService)',
              'domainClaimService := domainclaimmodule.NewService(db, domainClaimRepository, emailSender, dnsVerifier, emailTenantService)',
          )
          s = s.replace(
              'domainClaimConsumer, err := domainclaimreconciliation.NewConsumer(\n\t\tdomainClaimRepository,\n\t\tdomainClaimService,\n\t\tdomainclaimreconciliation.DefaultConfig(),',
              'domainClaimJob, err := domainclaimmodule.NewJob(\n\t\tdomainClaimRepository,\n\t\tdomainClaimService,\n\t\tdomainclaimmodule.DefaultJobConfig(),',
          )
          s = s.replace('domainClaimReconciliation: domainClaimConsumer.Run,', 'domainClaimReconciliation: domainClaimJob.Run,')
          worker.write_text(s)

          server = Path('server/internal/registry/server/modules.go')
          s = server.read_text()
          s = s.replace(
              'domainClaimService := domainclaimmodule.NewService(domainClaimRepository, registry.emailClient, dnsVerifier, emailTenantService)',
              'domainClaimService := domainclaimmodule.NewService(db, domainClaimRepository, registry.emailClient, dnsVerifier, emailTenantService)',
          )
          server.write_text(s)

          jobs = Path('server/internal/registry/worker/jobs.go')
          s = jobs.read_text().replace(
              'sender domain claim reconciliation consumer',
              'sender domain claim reconciliation job',
          )
          jobs.write_text(s)

          old = Path('server/internal/delivery/domainclaim/consumer.go')
          if old.exists():
              old.unlink()
          PY

      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Format changed Go code
        run: |
          gofmt -w \
            server/internal/modules/domainclaim/*.go \
            server/internal/registry/server/modules.go \
            server/internal/registry/worker/modules.go \
            server/internal/registry/worker/jobs.go

      - name: Compile affected packages
        working-directory: server
        run: |
          go test ./internal/modules/domainclaim ./internal/registry/server ./internal/registry/worker

      - name: Commit refactor output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refactor domain claims into vertical module"
          git push origin HEAD:agent/fix-domain-lifecycle-claims
