name: Temporary Module Architecture Inventory

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

permissions:
  contents: read

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-domain-lifecycle-claims
      - name: List module files
        run: |
          echo '=== MODULE FILES ==='
          find server/internal/modules -type f -print | sort
          echo '=== DELIVERY FILES ==='
          find server/internal/delivery -type f -print | sort
