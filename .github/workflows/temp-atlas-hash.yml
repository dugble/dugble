name: Temporary Atlas Hash

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Atlas checksum
        run: |
          docker run --rm \
            -v "$PWD/server/migrations:/migrations" \
            arigaio/atlas:1.3.0 \
            migrate hash --dir file:///migrations
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-sum
          path: server/migrations/atlas.sum
