name: Format and Lint Server Go

on:
  push:
    branches:
      - agent/fix-domain-lifecycle-claims
    paths:
      - ".github/workflows/format-server.yml"
      - ".golangci.yml"
      - "server/go.mod"
      - "server/go.sum"
      - "server/**/*.go"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-lint-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config ../.golangci.yml

      - name: Format server Go
        run: golangci-lint fmt --config ../.golangci.yml ./...

      - name: Verify formatted diff
        working-directory: .
        run: git diff --check

      - name: Commit formatting changes
        id: commit
        working-directory: .
        run: |
          if [[ -z "$(git status --porcelain -- server)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server
          git commit -m "style: format server Go code"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        run: golangci-lint run --config ../.golangci.yml ./...
