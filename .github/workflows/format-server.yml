name: Validate Outbox Quarantine

on:
  push:
    branches:
      - feat/outbox-quarantine
    paths:
      - ".github/workflows/format-server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-outbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Preserve pre-redrive history in transaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/internal/platform/outbox/repository.go')
          text = path.read_text()
          old = '''\tvar previousCode string
\tvar previousReason string
\tvar previousPublishFailures int
\tvar redriveCount int
\tif err := tx.QueryRow(ctx, `
\t\tUPDATE outbox_events
\t\tSET quarantined_at = NULL,
\t\t\tquarantine_code = NULL,
\t\t\tquarantine_reason = NULL,
\t\t\tpublish_failures = 0,
\t\t\tredrive_count = redrive_count + 1,
\t\t\tavailable_at = now(),
\t\t\tlocked_at = NULL,
\t\t\tlocked_by = NULL,
\t\t\tlast_error = NULL,
\t\t\tupdated_at = now()
\t\tWHERE id = $1
\t\t  AND published_at IS NULL
\t\t  AND quarantined_at IS NOT NULL
\t\tRETURNING
\t\t\tCOALESCE(quarantine_code, ''),
\t\t\tCOALESCE(quarantine_reason, ''),
\t\t\tpublish_failures,
\t\t\tredrive_count
\t`, eventID).Scan(&previousCode, &previousReason, &previousPublishFailures, &redriveCount); err != nil {'''
          new = '''\tvar previousCode string
\tvar previousReason string
\tvar previousPublishFailures int
\tvar redriveCount int
\tif err := tx.QueryRow(ctx, `
\t\tWITH quarantined AS (
\t\t\tSELECT quarantine_code, quarantine_reason, publish_failures
\t\t\tFROM outbox_events
\t\t\tWHERE id = $1
\t\t\t  AND published_at IS NULL
\t\t\t  AND quarantined_at IS NOT NULL
\t\t\tFOR UPDATE
\t\t), redriven AS (
\t\t\tUPDATE outbox_events
\t\t\tSET quarantined_at = NULL,
\t\t\t\tquarantine_code = NULL,
\t\t\t\tquarantine_reason = NULL,
\t\t\t\tpublish_failures = 0,
\t\t\t\tredrive_count = redrive_count + 1,
\t\t\t\tavailable_at = now(),
\t\t\t\tlocked_at = NULL,
\t\t\t\tlocked_by = NULL,
\t\t\t\tlast_error = NULL,
\t\t\t\tupdated_at = now()
\t\t\tWHERE id = $1
\t\t\t  AND EXISTS (SELECT 1 FROM quarantined)
\t\t\tRETURNING redrive_count
\t\t)
\t\tSELECT
\t\t\tCOALESCE(quarantined.quarantine_code, ''),
\t\t\tCOALESCE(quarantined.quarantine_reason, ''),
\t\t\tquarantined.publish_failures,
\t\t\tredriven.redrive_count
\t\tFROM quarantined
\t\tCROSS JOIN redriven
\t`, eventID).Scan(&previousCode, &previousReason, &previousPublishFailures, &redriveCount); err != nil {'''
          if old not in text:
              raise SystemExit('expected redrive block not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Format Go
        working-directory: server
        run: gofmt -w internal/platform/outbox/repository.go

      - name: Refresh Atlas migration checksums
        run: |
          docker run --rm \
            -v "$PWD/server/migrations:/migrations" \
            arigaio/atlas:1.3.0 \
            migrate hash --dir file:///migrations

      - name: Verify migration layout
        run: |
          test ! -e server/migrations/039_add_outbox_quarantine.sql
          grep -q 'CREATE TABLE IF NOT EXISTS outbox_event_actions' server/migrations/012_create_outbox.sql
          grep -q 'redrive_count INTEGER NOT NULL DEFAULT 0' server/migrations/012_create_outbox.sql

      - name: Test outbox
        working-directory: server
        run: go test -race ./internal/platform/outbox ./internal/adapters/nats

      - name: Vet outbox
        working-directory: server
        run: go vet ./internal/platform/outbox ./internal/adapters/nats

      - name: Verify diff
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/internal/platform/outbox/repository.go server/migrations/atlas.sum
          if git diff --cached --quiet; then
            echo "No validation-generated changes."
            exit 0
          fi
          git commit -m "fix(outbox): preserve redrive lifecycle history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
