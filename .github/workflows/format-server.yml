name: Format Server Go

on:
  push:
    branches:
      - agent/fix-subscription-ci
    paths:
      - ".github/workflows/format-server.yml"
      - ".golangci.yml"
      - "server/**/*.go"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: format-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Format server Go
        run: golangci-lint fmt --config ../.golangci.yml ./...

      - name: Verify diff
        working-directory: .
        run: git diff --check

      - name: Commit formatting changes
        id: commit
        working-directory: .
        run: |
          if [[ -z "$(git status --porcelain -- server)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server
          git commit -m "Format server Go code"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Re-run Server CI
        if: steps.commit.outputs.changed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run server.yml --ref "$GITHUB_REF_NAME"
