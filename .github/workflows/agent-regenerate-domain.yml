name: Agent Regenerate Domain Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/agent-regenerate-domain.yml"
      - "server/migrations/**"
      - "server/internal/database/queries/**"
      - "server/sqlc.yaml"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Regenerate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Regenerate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Emit generated artifacts
        run: |
          for file in \
            server/migrations/atlas.sum \
            server/internal/database/sqlc/models.go \
            server/internal/database/sqlc/domains.sql.go \
            server/internal/database/sqlc/domain_claims.sql.go; do
            echo "ARTIFACT_BEGIN:${file}"
            base64 -w0 "${file}"
            echo
            echo "ARTIFACT_END:${file}"
          done
