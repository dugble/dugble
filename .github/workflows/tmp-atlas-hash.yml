name: Temporary Atlas Hash

on:
  pull_request:
    paths:
      - "server/migrations/**"
      - ".github/workflows/tmp-atlas-hash.yml"

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate Atlas checksum
        run: |
          docker run --rm \
            -v "${PWD}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: atlas-sum
          path: server/migrations/atlas.sum
