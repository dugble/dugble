name: Temporary Refactor Sender ID Boundaries

on:
  push:
    branches:
      - agent/refactor-senderid-module-boundaries

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-senderid-module-boundaries
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Regenerate sqlc
        working-directory: server
        run: sqlc generate
      - name: Format sender ID repository
        run: gofmt -w server/internal/modules/senderid/repository.go server/internal/database/sqlc
      - name: Assert repository boundary
        run: |
          if sed -n '/type Repository struct {/,/}/p' server/internal/modules/senderid/repository.go | grep -q 'pgxpool.Pool'; then
            echo 'senderid repository still stores pgxpool' >&2
            exit 1
          fi
          if grep -Eq '\.Query(Row)?\(|\.Exec\(' server/internal/modules/senderid/repository.go; then
            echo 'senderid repository still contains raw database calls' >&2
            exit 1
          fi
          grep -q 'queries \*dbsqlc.Queries' server/internal/modules/senderid/repository.go
      - name: Run full server tests
        working-directory: server
        run: go test ./...
      - name: Commit generated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate sender ID sqlc persistence"
          git push origin HEAD:agent/refactor-senderid-module-boundaries
