name: Temporary Domain Claim Formatter

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-format-domainclaim.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Format changed Go files
        working-directory: server
        run: |
          gofmt -w \
            internal/modules/domainclaim/*.go \
            internal/delivery/domainclaim/*.go \
            internal/modules/domain/model.go \
            internal/modules/domain/validation.go \
            internal/modules/email/repository.go \
            internal/registry/server/modules.go \
            internal/registry/worker/modules.go \
            internal/registry/worker/jobs.go
          go run golang.org/x/tools/cmd/goimports@v0.44.0 -w \
            internal/modules/domainclaim/*.go \
            internal/delivery/domainclaim/*.go \
            internal/modules/domain/model.go \
            internal/modules/domain/validation.go \
            internal/modules/email/repository.go \
            internal/registry/server/modules.go \
            internal/registry/worker/modules.go \
            internal/registry/worker/jobs.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "Format domain claim lifecycle changes"
          git push origin HEAD:${{ github.head_ref }}
